name: E2E Tests

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options: [all, api, website, docs, dashboard, status, smoke]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:smoke
        env:
          BASE_URL: https://api.morgenruf.dev

  full:
    name: E2E Suite (${{ inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'smoke')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run test suite
        # Schedule runs have no inputs, so suite falls back to 'all'.
        run: |
          case "$SUITE" in
            all) npm test ;;
            api|website|docs|dashboard|status) npm run "test:$SUITE" ;;
            *) echo "Unknown suite: $SUITE" >&2; exit 1 ;;
          esac
        env:
          SUITE: ${{ inputs.suite || 'all' }}
          BASE_URL: https://api.morgenruf.dev
          MCP_TEST_KEY: ${{ secrets.MCP_TEST_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
